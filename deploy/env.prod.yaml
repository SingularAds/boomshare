# Non-secret production configuration for Cloud Run.
#
#   gcloud run deploy ... --env-vars-file deploy/env.prod.yaml
#
# Secrets (DATABASE_URL, REDIS_URL, META_*, OPENAI_API_KEY, INTERNAL_API_TOKEN)
# are NOT here - they come from Secret Manager via --set-secrets. See README.md.

ENVIRONMENT: production
DEBUG: "false"
LOG_LEVEL: INFO
LOG_JSON: "true"

# Meta / WhatsApp - identifiers, not secrets
META_GRAPH_VERSION: v26.0
META_GRAPH_BASE_URL: https://graph.facebook.com
WHATSAPP_PHONE_NUMBER_IDS: '["1271448969390854", "1345891858597364", "113648911781193"]'
# What the operator dashboard calls each of the above. Meta's id tells a
# human nothing; without this the dashboard falls back to "Number 1"/"Number 2".
WHATSAPP_NUMBER_LABELS: '{"1271448969390854":"+55 11 5028-5163","1345891858597364":"+1 417-547-1904","113648911781193":"+91 89680 12547"}'
WHATSAPP_LEAD_TEMPLATE_NAME: boomshare_lead_intro
WHATSAPP_LEAD_TEMPLATE_LANGUAGE: en
WHATSAPP_FOLLOWUP_TEMPLATE_NAME: boomshare_followup
WHATSAPP_FOLLOWUP_TEMPLATE_LANGUAGE: en
# Template translations approved in WhatsApp Manager, keyed by the customer's
# language. Matched on the exact locale first, then the base language, so one
# approved pt_BR serves Brazil and Portugal and one es every Spanish market.
# Nothing goes in here before Meta has approved it: an unapproved language code
# is error 132001 and the follow-up simply fails.
WHATSAPP_TEMPLATE_LANGUAGES: '{"boomshare_lead_intro":{"pt":"pt_BR","es":"es","en":"en"},"boomshare_followup":{"pt":"pt_BR","es":"es","en":"en"}}'
# The approved bodies, word for word from WhatsApp Manager. A sent template is
# stored as these words - it is what the dashboard shows and what the AI reads
# back as its own history - so this has to be updated whenever Meta's copy is.
WHATSAPP_TEMPLATE_BODIES: '{"boomshare_lead_intro":{"pt_BR":"Olá {{1}}, obrigado pelo seu interesse no Boomshare! Fico feliz em tirar qualquer dúvida — o que fez você se interessar por ele?","es":"¡Hola {{1}}! Gracias por tu interés en Boomshare. Con gusto respondo cualquier duda. ¿Qué te llevó a buscar una herramienta como esta?","en":"Hi {{1}}, thanks for your interest in Boomshare! Happy to answer any questions - what made you look into it?"},"boomshare_followup":{"pt_BR":"Olá {{1}}, só passando para saber sobre o Boomshare. Ainda tem interesse? Fico feliz em ajudar quando for melhor para você.","es":"Hola {{1}}, solo paso para ver qué tal con Boomshare. ¿Sigues interesado? Con gusto te ayudo cuando te convenga.","en":"Hi {{1}}, just checking in about Boomshare. Still interested? Happy to help whenever suits."}}'

# OpenAI - model + limits, key is a secret
OPENAI_MODEL: gpt-4o-mini
OPENAI_TIMEOUT_SECONDS: "30"
OPENAI_MAX_RETRIES: "2"
OPENAI_TEMPERATURE: "0.6"
OPENAI_MAX_OUTPUT_TOKENS: "700"

# Product
DOWNLOAD_BASE_URL: https://boomshare.ai/download
MAX_REPLY_CHARACTERS: "900"

# Conversation policy
SERVICE_WINDOW_HOURS: "24"
HISTORY_MESSAGE_LIMIT: "20"
AI_REPLY_LOCK_SECONDS: "30"
# Wait for a busy conversation rather than parking the job until the sweep.
AI_REPLY_LOCK_WAIT_SECONDS: "20"
INBOUND_RATE_LIMIT_PER_MINUTE: "20"
# Gaps between unanswered check-ins, each measured from the one before it. The
# running total against SERVICE_WINDOW_HOURS decides how each one is sent: 4h
# is inside the window and is written by the AI, 26h and 98h are outside it and
# go as the approved template. Keep the totals clear of 24h, not on it.
FOLLOW_UP_LADDER_HOURS: "[4, 22, 72]"

# Conversation language. The phone number's country picks it; an entry here
# overrules that for a market. +91 is hi-IN by CLDR and we answer it in English.
DEFAULT_CONVERSATION_LANGUAGE: en
COUNTRY_LANGUAGE_OVERRIDES: '{"IN":"en-IN","ES":"es-ES","PT":"pt-PT","BR":"pt-BR"}'

# Worker
WORKER_QUEUE_NAME: boomshare:jobs
# Jobs run at a time per worker. Keep at or below DB_POOL_SIZE.
WORKER_CONCURRENCY: "4"
WORKER_POLL_INTERVAL_SECONDS: "1"
WORKER_BATCH_SIZE: "20"
WORKER_MAX_ATTEMPTS: "5"
# Must exceed one reply turn's worst case (OpenAI 30s x 3 + Meta retries) so the
# sweeper never re-enqueues a job that is still running.
WEBHOOK_SWEEP_AFTER_SECONDS: "180"
SCHEDULER_INTERVAL_SECONDS: "15"

# Postgres pool. Small tiers (db-f1-micro / db-g1-small) cap total connections
# hard. Keep DB_POOL_SIZE x (api max-instances + worker) under the instance's
# max_connections (SHOW max_connections;). Lower this or --max-instances if you
# see "too many connections". pool_pre_ping is already on for Cloud SQL.
DB_POOL_SIZE: "5"
DB_MAX_OVERFLOW: "2"
DB_ECHO: "false"
REDIS_DEFAULT_TTL_SECONDS: "3600"
